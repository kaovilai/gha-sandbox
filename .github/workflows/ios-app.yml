name: ios-app

# t3code mobile app (Expo dev client) on an iOS Simulator: build, seed, capture
# screenshots via upstream scripts/mobile-showcase.ts, plus a screen recording pass.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      ref:
        description: Ref (branch/sha, or pull/<N>/head)
        default: main

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OUT_DIR: ${{ github.workspace }}/out/ios-app
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          working-directory: target
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Install pnpm (pinned by target)
        working-directory: target
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop().split('+')[0]")"
          npm install -g "pnpm@$pnpm_version"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          pnpm --version

      - name: Install AXe (simulator lock + notification prompt)
        run: |
          brew tap cameroncooke/axe
          if brew commands | grep -qx trust; then brew trust --formula cameroncooke/axe/axe; fi
          brew install cameroncooke/axe/axe
          axe --version

      - name: Build + capture on simulator
        run: bash scripts/ios-app.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-ios-app
          path: out/ios-app
