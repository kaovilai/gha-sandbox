name: ios-app

# t3code mobile app (Expo dev client) on an iOS Simulator: build, seed, capture
# screenshots via upstream scripts/mobile-showcase.ts, plus a screen recording pass.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      ref:
        description: Ref (branch/sha, or pull/<N>/head)
        default: main
      keep_running:
        description: Keep simulator+Metro after capture and record a scroll clip (else record throughout, trim last 15 s)
        type: boolean
        default: false
      live:
        description: After the showcase pass, drive LIVE mockkit threads in the app (implies keep_running)
        type: boolean
        default: false
      mock_provider:
        description: "Live mode only. Mock provider flavor: grok (ACP mock, default) | codex (Codex app-server mock: OpenAI icon, GPT-6-Astra) | both. See mockkit/README.md"
        type: choice
        options: [grok, codex, both]
        default: grok

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OUT_DIR: ${{ github.workspace }}/out/ios-app
      IOS_KEEP_RUNNING: ${{ (inputs.keep_running || inputs.live) && '1' || '0' }}
      IOS_LIVE: ${{ inputs.live && '1' || '0' }}
      MOCK_PROVIDER: ${{ inputs.mock_provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          working-directory: target
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Install pnpm (pinned by target)
        working-directory: target
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop().split('+')[0]")"
          npm install -g "pnpm@$pnpm_version"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          pnpm --version

      - name: Install AXe (simulator lock + notification prompt)
        run: |
          brew tap cameroncooke/axe
          if brew commands | grep -qx trust; then brew trust --formula cameroncooke/axe/axe; fi
          brew install cameroncooke/axe/axe
          axe --version

      - name: Native-inputs hash (computed once; the build itself touches some of these files)
        id: native
        run: echo "hash=${{ hashFiles('target/pnpm-lock.yaml','target/apps/mobile/app.config.ts','target/apps/mobile/package.json','target/apps/mobile/plugins/**','target/apps/mobile/modules/**','target/patches/**') }}" >> "$GITHUB_OUTPUT"

      - name: Metro cache dirs
        id: metro
        run: |
          echo "tmp=$(node -p 'require("os").tmpdir()')" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Metro/Expo transform cache
        id: metro-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.metro.outputs.tmp }}/metro-cache
            target/node_modules/.cache
            target/apps/mobile/.expo
          key: metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-${{ steps.metro.outputs.week }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-
            metro-${{ runner.os }}-

      - name: Restore built T3Code.app (native build is the slow part)
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: target/apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/T3Code.app
          key: ios-app-${{ runner.os }}-${{ steps.native.outputs.hash }}

      - name: Build + capture on simulator
        run: bash scripts/ios-app.sh

      - name: Save built T3Code.app (once per native hash, even if capture failed)
        if: always() && steps.app-cache.outputs.cache-hit != 'true' && hashFiles('target/apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/T3Code.app/Info.plist') != ''
        uses: actions/cache/save@v4
        with:
          path: target/apps/mobile/.showcase/ios-derived-data/Build/Products/Debug-iphonesimulator/T3Code.app
          key: ios-app-${{ runner.os }}-${{ steps.native.outputs.hash }}

      - name: Report cache dir sizes (verifies Metro cache path guesses)
        if: always()
        run: du -sh "${{ steps.metro.outputs.tmp }}"/metro-* target/node_modules/.cache target/apps/mobile/.expo 2>/dev/null || true

      - name: Save Metro/Expo transform cache (once per lockfile per week)
        if: always() && steps.metro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.metro.outputs.tmp }}/metro-cache
            target/node_modules/.cache
            target/apps/mobile/.expo
          key: metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-${{ steps.metro.outputs.week }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-ios-app
          path: out/ios-app

  publish:
    needs: capture
    if: always() && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: out-ios-app
          path: dl
      - name: Setup ffmpeg (static build; apt mirror stalls on runners)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}
      - name: Push evidence branch + markdown
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-evidence.sh dl ios-app
