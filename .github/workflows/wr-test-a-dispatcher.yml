name: WR test A (dispatcher)

on:
  push:
    paths:
      - '.github/workflows/wr-test-a-dispatcher.yml'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          set -euo pipefail
          echo "dispatching WR test B with builtin GITHUB_TOKEN"
          gh workflow run wr-test-b-target.yml
          echo "done — if WR test C (workflow_run watcher) fires after B completes, workflow_run works for GITHUB_TOKEN-dispatched runs"
