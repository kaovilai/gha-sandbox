name: GH_TOKEN dispatch test (dispatcher)

# Mirrors konveyor/builder PR #46 scheduled_dispatch.yml exactly where it matters:
# - no checkout step
# - no GH_REPO env var
# - only GH_TOKEN: ${{ github.token }} with a permissions block
# Proves whether the builtin GITHUB_TOKEN can create downstream
# workflow_dispatch and repository_dispatch runs (recursion-guard exception),
# and who the resulting runs are attributed to.

on:
  push:
    paths:
      - '.github/workflows/gh-token-dispatch-test-dispatcher.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # gh CLI cannot resolve the repo from git remotes (no checkout) and does
      # not read GITHUB_REPOSITORY on its own -- without this, `gh workflow run`
      # fails with "fatal: not a git repository".
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch target with builtin GITHUB_TOKEN (no checkout, no GH_REPO)
        run: |
          set -euo pipefail
          echo "dispatcher event_name:       ${{ github.event_name }}"
          echo "dispatcher actor:            ${{ github.actor }}"
          echo "dispatcher triggering_actor: ${{ github.triggering_actor }}"
          gh --version

          echo "--- 1) workflow_dispatch via gh workflow run (repo resolution unaided) ---"
          gh workflow run gh-token-dispatch-test-target.yml -f message=hello-from-builtin-GITHUB_TOKEN

          echo "--- 2) repository_dispatch via gh api (explicit path) ---"
          gh api repos/kaovilai/gha-sandbox/dispatches -f event_type=gh-token-dispatch-test -f 'client_payload[message]=hello-from-repository-dispatch'

          echo "--- polling up to ~2 minutes for the target runs ---"
          for i in $(seq 1 12); do
            sleep 10
            runs=$(gh api "repos/kaovilai/gha-sandbox/actions/workflows/gh-token-dispatch-test-target.yml/runs?per_page=10" \
              --jq '[.workflow_runs[] | {id, event, actor: .actor.login, triggering: .triggering_actor.login, status, conclusion}]')
            echo "attempt ${i}: ${runs}"
            wf_count=$(echo "$runs" | jq '[.[] | select(.event=="workflow_dispatch")] | length')
            rd_count=$(echo "$runs" | jq '[.[] | select(.event=="repository_dispatch")] | length')
            if [ "$wf_count" -ge 1 ] && [ "$rd_count" -ge 1 ]; then
              echo "SUCCESS: builtin GITHUB_TOKEN created both a workflow_dispatch run and a repository_dispatch run."
              exit 0
            fi
          done
          echo "FAIL: expected runs were not created by the builtin GITHUB_TOKEN."
          exit 1
