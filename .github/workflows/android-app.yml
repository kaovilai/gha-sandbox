name: android-app

# t3code mobile app (Expo dev client) on an Android emulator: build, seed, capture
# screenshots via upstream scripts/mobile-showcase.ts, plus a screen recording pass.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      ref:
        description: Ref (branch/sha, or pull/<N>/head)
        default: main
      live:
        description: After the showcase pass, drive LIVE mockkit threads in the app (streaming, approval, question)
        type: boolean
        default: false
      mock_provider:
        description: "Live mode only. Mock provider flavor: grok (ACP mock, default) | codex (Codex app-server mock: OpenAI icon, GPT-6-Astra) | both. See mockkit/README.md"
        type: choice
        options: [grok, codex, both]
        default: grok

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      T3_SHOWCASE_ANDROID_ABI: x86_64
      NODE_OPTIONS: --max-old-space-size=4096
      OUT_DIR: ${{ github.workspace }}/out/android-app
      LIVE: ${{ inputs.live && '1' || '0' }}
      MOCK_PROVIDER: ${{ inputs.mock_provider }}
    steps:
      - name: Free disk (Android SDK + Gradle + emulator image are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: "Swap + Gradle memory limits (16 GB runner)"
        run: |
          # Runner image already uses /swapfile; add a second one on the big /mnt disk.
          sudo fallocate -l 10G /mnt/swap2
          sudo chmod 600 /mnt/swap2
          sudo mkswap /mnt/swap2
          sudo swapon /mnt/swap2
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
            echo 'kotlin.daemon.jvm.options=-Xmx2g'
            echo 'org.gradle.workers.max=2'
          } >> ~/.gradle/gradle.properties
          free -h

      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          working-directory: target
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
              - --filter=t3...

      - name: Install pnpm (pinned by target)
        working-directory: target
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop().split('+')[0]")"
          npm install -g "pnpm@$pnpm_version"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          pnpm --version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Native-inputs hash (computed once; the build itself touches some of these files)
        id: native
        run: echo "hash=${{ hashFiles('target/pnpm-lock.yaml','target/apps/mobile/app.config.ts','target/apps/mobile/package.json','target/apps/mobile/plugins/**','target/apps/mobile/modules/**','target/patches/**') }}" >> "$GITHUB_OUTPUT"

      - name: Metro cache dirs
        id: metro
        run: |
          echo "tmp=$(node -p 'require("os").tmpdir()')" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Metro/Expo transform cache
        id: metro-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.metro.outputs.tmp }}/metro-cache
            target/node_modules/.cache
            target/apps/mobile/.expo
          key: metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-${{ steps.metro.outputs.week }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-
            metro-${{ runner.os }}-

      - name: Restore debug APK cache (native build is the slow part)
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: target/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: android-apk-${{ steps.native.outputs.hash }}

      - name: AVD cache (snapshot boots in seconds instead of minutes)
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api36-x86_64-pixel7pro-4c-3g-v1

      - name: Create AVD + snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 4
          ram-size: 3072M
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Generated AVD snapshot for caching."

      - name: Build + capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 4
          ram-size: 3072M
          disable-animations: false
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          script: bash scripts/android-app.sh

      - name: Save debug APK cache
        if: always() && steps.apk-cache.outputs.cache-hit != 'true' && hashFiles('target/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/cache/save@v4
        with:
          path: target/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          key: android-apk-${{ steps.native.outputs.hash }}

      - name: Report cache dir sizes (verifies Metro cache path guesses)
        if: always()
        run: du -sh "${{ steps.metro.outputs.tmp }}"/metro-* target/node_modules/.cache target/apps/mobile/.expo 2>/dev/null || true

      - name: Save Metro/Expo transform cache (once per lockfile per week)
        if: always() && steps.metro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.metro.outputs.tmp }}/metro-cache
            target/node_modules/.cache
            target/apps/mobile/.expo
          key: metro-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}-${{ steps.metro.outputs.week }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-android-app
          path: out/android-app

  publish:
    needs: capture
    if: always() && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: out-android-app
          path: dl
      - name: Setup ffmpeg (static build; apt mirror stalls on runners)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}
      - name: Push evidence branch + markdown
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-evidence.sh dl android-app
