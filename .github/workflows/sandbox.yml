name: sandbox

# One-off Linux VM for PR repro: build target at base+head refs, drive UI with a
# Playwright scenario, publish before/after screenshots + recordings.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Target profile (dir under targets/)
        default: t3code
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      base_ref:
        description: Before ref (branch/sha)
        default: main
      head_ref:
        description: After ref (branch/sha, or pull/<N>/head for a PR)
        required: true
      scenario:
        description: Scenario path in this repo (default targets/<profile>/scenario.mjs)
        default: ""
      scenarios:
        description: "Scenario ids for mock profiles, comma list, short prefix (s07) or pack name (web, smoke, all; see mockkit/packs.json). Exported as SCENARIOS."
        default: ""
      sides:
        description: Which sides to run
        type: choice
        options: [both, before, after]
        default: both
      debug_shell:
        description: Open tmate SSH session (actor only) after capture
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SIDES: ${{ inputs.sides }}
          BASE: ${{ inputs.base_ref }}
          HEAD: ${{ inputs.head_ref }}
        run: |
          jq -cn --arg s "$SIDES" --arg b "$BASE" --arg h "$HEAD" '
            [{side:"before",ref:$b},{side:"after",ref:$h}]
            | map(select($s=="both" or .side==$s))
            | {include: .}' | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SIDE: ${{ matrix.side }}
      PROFILE: ${{ inputs.profile }}
      OUT_DIR: ${{ github.workspace }}/out/${{ matrix.side }}
      APP_LOG: /tmp/app.log
      APP_URL_FILE: /tmp/app.url
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ matrix.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - name: Read profile
        id: profile
        run: |
          test -d "targets/$PROFILE" || { echo "unknown profile: $PROFILE"; ls targets; exit 1; }
          set -a; . "targets/$PROFILE/profile.env"; set +a
          echo "vp=${USES_VP:-0}" >> "$GITHUB_OUTPUT"
          echo "node=${NODE_VERSION:-22}" >> "$GITHUB_OUTPUT"

      - name: Setup vp (profile uses Vite+)
        if: steps.profile.outputs.vp == '1'
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ steps.profile.outputs.node }}
          working-directory: target
          cache: true
          run-install: false

      - name: Setup Node
        if: steps.profile.outputs.vp != '1'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.profile.outputs.node }}

      - name: Install target deps (profile setup.sh)
        working-directory: target
        run: bash "$GITHUB_WORKSPACE/targets/$PROFILE/setup.sh"

      - name: Cache Playwright browsers + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: harness-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install harness (Playwright + Chromium)
        run: |
          npm ci
          # No --with-deps: it runs a bare apt-get that stalls on runners; the image already
          # ships Chrome's shared libraries. Fall back to installing deps only if launch fails.
          npx playwright install chromium
          node -e "import('playwright').then(async ({chromium})=>{const b=await chromium.launch();await b.close();console.log('chromium ok')})" \
            || timeout 900 npx playwright install-deps chromium

      - name: Start target app (profile start.sh)
        working-directory: target
        run: |
          mkdir -p "$OUT_DIR"
          bash "$GITHUB_WORKSPACE/targets/$PROFILE/start.sh"
          url=$(cat "$APP_URL_FILE")
          echo "::add-mask::$url"
          echo "APP_URL=$url" >> "$GITHUB_ENV"

      - name: Run scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: node "${SCENARIO:-targets/$PROFILE/scenario.mjs}"

      - name: App log
        if: always()
        run: cp "$APP_LOG" "$OUT_DIR/app.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.side }}
          path: out/${{ matrix.side }}

      - name: Debug shell
        if: inputs.debug_shell
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

  publish:
    needs: capture
    if: always() && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup ffmpeg (static build; apt mirror stalls on runners)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: out
          pattern: out-*

      - name: Build before/after + GIFs
        run: |
          shopt -s nullglob
          if ! compgen -G 'out/out-*/*' > /dev/null; then
            echo "no capture output; nothing to publish"
            echo "### No evidence captured (all capture jobs failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p pub
          for f in out/out-after/*.png; do
            n=$(basename "$f")
            cp "$f" "pub/after-$n"
            if [ -f "out/out-before/$n" ]; then
              cp "out/out-before/$n" "pub/before-$n"
              ffmpeg -nostdin -loglevel error -y -i "out/out-before/$n" -i "$f" \
                -filter_complex hstack=inputs=2 "pub/side-by-side-$n"
            fi
          done
          for f in out/out-*/*.webm; do
            side=$(basename "$(dirname "$f")" | sed 's/^out-//')
            b=$(basename "$f" .webm)
            ffmpeg -loglevel error -y -i "$f" -vf "fps=10,scale=960:-1:flags=lanczos" "pub/$side-$b.gif"
            ffmpeg -loglevel error -y -i "$f" -c:v libx264 -pix_fmt yuv420p "pub/$side-$b.mp4"
          done
          ls -la pub

      # Orphan `evidence` branch: raw.githubusercontent.com serves image/* content
      # types, so PNG/GIF embed inline in PR markdown (release assets do not).
      - name: Push evidence branch + markdown
        if: hashFiles('pub/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO_IN: ${{ inputs.scenario }}
          SCENARIOS_IN: ${{ inputs.scenarios }}
        run: |
          run="$GITHUB_RUN_ID"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git clone -q --depth 1 --branch evidence "$remote" ev 2>/dev/null; then
            git init -q ev
            git -C ev checkout -q --orphan evidence
            git -C ev remote add origin "$remote"
          fi
          mkdir -p "ev/$run"
          cp pub/* "ev/$run/"
          printf 'target=%s base=%s head=%s scenario=%s scenarios=%s\n' \
            "${{ inputs.repo }}" "${{ inputs.base_ref }}" "${{ inputs.head_ref }}" "$SCENARIO_IN" "$SCENARIOS_IN" > "ev/$run/INFO.txt"
          git -C ev add -A
          git -C ev commit -q -m "evidence $run"
          for i in 1 2 3; do
            git -C ev push -q origin evidence && break
            git -C ev pull -q --rebase origin evidence
          done
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/evidence/${run}"
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/evidence/${run}"
          {
            echo '### Evidence markdown'
            echo '```markdown'
            for f in pub/side-by-side-*.png; do [ -f "$f" ] && echo "![$(basename "$f")]($raw/$(basename "$f"))"; done
            for f in pub/*.gif; do [ -f "$f" ] && echo "![$(basename "$f")]($raw/$(basename "$f"))"; done
            for f in pub/*.mp4; do [ -f "$f" ] && echo "[$(basename "$f")]($blob/$(basename "$f")?raw=true)"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
