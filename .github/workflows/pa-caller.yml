name: PA caller

# Phase-2 probe v2: reusable workflow called from a matrix job. Per-leg
# gating cannot use `matrix` in a job-level `if` (evaluated before matrix
# expansion — invalid workflow file), so the condition is computed in
# `with:` (matrix allowed there) and passed as a boolean input the callee
# gates its job on.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this leg'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/pa-caller.yml'

jobs:
  gated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { v: x }
          - { v: y }
          - { v: z }
    uses: ./.github/workflows/pa-reusable.yml
    with:
      v: ${{ matrix.v }}
      run: >-
        ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == '' || matrix.v == inputs.only)) ||
             (github.event_name != 'workflow_dispatch' && matrix.v != 'y') }}
