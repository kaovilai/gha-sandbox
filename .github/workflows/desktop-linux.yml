name: desktop-linux

# Electron desktop app on Linux under Xvfb: real desktop screenshot + screen recording.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      ref:
        description: Ref (branch/sha, or pull/<N>/head)
        default: main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: ${{ github.workspace }}/out/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          working-directory: target
          cache: true
          run-install: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}

      - name: System deps (Xvfb, X tools, ffmpeg, Electron libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsecret-1-dev xvfb xdotool x11-utils imagemagick ffmpeg \
            libgbm1 libnss3 libgtk-3-0t64 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64
          # Ubuntu 24 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Capture
        run: bash scripts/desktop-capture.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-desktop
          path: out/desktop
