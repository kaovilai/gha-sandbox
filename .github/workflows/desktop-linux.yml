name: desktop-linux

# Electron desktop app on Linux under Xvfb: real desktop screenshot + screen recording.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repo (owner/name)
        default: pingdotgg/t3code
      ref:
        description: Ref (branch/sha, or pull/<N>/head)
        default: main
      mock:
        description: "Mock kit: seed mockkit mock provider + workspace, drive the real Electron window over CDP + xdotool, record scenarios"
        type: boolean
        default: false
      scenarios:
        description: "Mock only: ids, short prefixes (s03, dk02) or pack (desktop, see mockkit/packs.json). Default pack: desktop"
        default: ""
      mock_provider:
        description: "Mock provider flavor: grok (ACP mock, default) | codex (Codex app-server mock: OpenAI icon, GPT-6-Astra) | claude (Claude stream-json mock: Claude icon, Claude Fable/Opus/Sonnet) | both (grok+codex) | all (grok+codex+claude). See mockkit/README.md"
        type: choice
        options: [grok, codex, claude, both, all]
        default: grok

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT_DIR: ${{ github.workspace }}/out/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Checkout target
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
        run: |
          git init target
          git -C target fetch --depth=1 "https://github.com/$REPO" "$REF"
          git -C target checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          working-directory: target
          cache: true
          run-install: true

      - name: Resolve target sha
        id: sha
        run: echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vp task cache + build outputs
        id: vp-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/.vite-plus
            target/apps/*/.vite-plus
            target/packages/*/.vite-plus
            target/apps/desktop/dist-electron
            target/apps/server/dist
            target/apps/web/dist
          key: vp-${{ runner.os }}-${{ steps.sha.outputs.sha }}
          restore-keys: vp-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('target/pnpm-lock.yaml') }}

      - name: System deps (Xvfb, X tools, ffmpeg, Electron libs)
        if: "!inputs.mock"
        timeout-minutes: 20
        run: |
          bash scripts/apt-install.sh build-essential pkg-config libsecret-1-dev xvfb xdotool x11-utils \
            imagemagick ffmpeg libgbm1 libnss3 libgtk-3-0t64 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64
          # Ubuntu 24 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Mock mode: smaller apt set (no apt ffmpeg: it pulls ~100 libs and has stalled the apt mirror for 20+ min);
      # ffmpeg comes from the static setup-ffmpeg build instead.
      - name: System deps, minimal (mock)
        if: inputs.mock
        timeout-minutes: 12
        run: |
          bash scripts/apt-install.sh build-essential pkg-config libsecret-1-dev xvfb xdotool x11-utils imagemagick libgbm1 libnss3 libgtk-3-0t64 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Setup ffmpeg (static build; mock recording)
        if: inputs.mock
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}

      - name: Harness deps (Playwright client only; attaches to Electron over CDP, no browser download)
        if: inputs.mock
        run: npm ci

      - name: Capture
        env:
          BUILD_CACHE_HIT: ${{ steps.vp-cache.outputs.cache-hit }}
          MOCK: ${{ inputs.mock }}
          SCENARIOS: ${{ inputs.scenarios }}
          MOCK_PROVIDER: ${{ inputs.mock_provider }}
        run: bash scripts/desktop-capture.sh

      - name: Save vp task cache + build outputs (per target sha)
        if: always() && steps.vp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/.vite-plus
            target/apps/*/.vite-plus
            target/packages/*/.vite-plus
            target/apps/desktop/dist-electron
            target/apps/server/dist
            target/apps/web/dist
          key: vp-${{ runner.os }}-${{ steps.sha.outputs.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-desktop
          path: out/desktop

  publish:
    needs: capture
    if: always() && needs.capture.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: out-desktop
          path: dl
      - name: Setup ffmpeg (static build; apt mirror stalls on runners)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ github.token }}
      - name: Push evidence branch + markdown
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-evidence.sh dl desktop
